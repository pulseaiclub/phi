<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>phi · 架构图</title>
<style>
  :root {
    /* phi Dark theme (internal/components/theme.go) */
    --bg:        #0b0d10;
    --panel:     #12161b;
    --panel2:    #171c22;
    --fg:        #d0d4dc;
    --muted:     #868c97;
    --border:    #262d36;
    --teal:      #5ec4b4;  /* Identity */
    --blue:      #7dc3ff;  /* ToolName / info */
    --purple:    #c48ad9;  /* Accent */
    --mint:      #7dc3a0;  /* Success */
    --yellow:    #e5c07b;  /* Warning */
    --rose:      #e06c75;  /* Destructive */
    --slate:     #93a3b8;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 15% -10%, #141a22 0%, var(--bg) 60%);
    color: var(--fg);
    font: 13.5px/1.65 var(--mono);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 28px clamp(14px, 4vw, 44px) 60px;
  }
  a { color: var(--blue); }
  code, .mono { font-family: var(--mono); }

  /* ── header ─────────────────────────────────────────── */
  header {
    max-width: 1180px; margin: 0 auto 22px;
    display: flex; flex-wrap: wrap; gap: 16px 20px; align-items: flex-end;
    justify-content: space-between;
  }
  .brandline { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-size: 26px; letter-spacing: .34em; font-weight: 600;
    color: var(--fg); text-transform: lowercase;
  }
  .brand::after { content: "▊"; color: var(--teal); margin-left: 2px; animation: blink 1.4s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .sub { color: var(--muted); font-size: 12px; letter-spacing: .08em; }
  .tagline { color: var(--muted); font-size: 12px; margin-top: 4px; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav button {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 2px; padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  nav button:hover { color: var(--fg); border-color: #39424e; }
  nav button[aria-selected="true"] { color: var(--bg); background: var(--fg); border-color: var(--fg); }

  /* ── search ─────────────────────────────────────────── */
  .searchwrap { position: relative; max-width: 1180px; margin: 0 auto 20px; }
  .searchwrap input {
    width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--fg);
    border-radius: 2px; padding: 9px 12px; font: inherit; font-size: 12.5px; outline: none;
  }
  .searchwrap input:focus { border-color: var(--blue); box-shadow: 0 0 0 1px rgba(125,195,255,.22); }
  .searchwrap input::placeholder { color: #5d646f; }
  .hits {
    position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px);
    background: var(--panel2); border: 1px solid var(--border); border-radius: 2px;
    max-height: 280px; overflow: auto; display: none;
  }
  .hits.on { display: block; }
  .hit {
    display: flex; gap: 10px; width: 100%; text-align: left; padding: 7px 12px;
    background: none; border: 0; border-bottom: 1px solid #1d232a; color: var(--fg);
    font: inherit; font-size: 12px; cursor: pointer;
  }
  .hit:last-child { border-bottom: 0; }
  .hit:hover, .hit:focus-visible { background: #1d2530; outline: none; }
  .hit .where { color: var(--muted); margin-left: auto; white-space: nowrap; }

  /* ── layout ─────────────────────────────────────────── */
  main { max-width: 1180px; margin: 0 auto; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 26px; align-items: start; }
  @media (max-width: 880px) { .split { grid-template-columns: 1fr; } }

  /* ── stack ──────────────────────────────────────────── */
  .stack { display: flex; flex-direction: column; }
  .card {
    --c: var(--slate);
    display: grid; grid-template-columns: 30px minmax(0, 1fr) 16px; gap: 12px; align-items: start;
    width: 100%; text-align: left; cursor: pointer;
    background: var(--panel); border: 1px solid var(--border); border-left: 2px solid var(--c);
    border-radius: 2px; padding: 11px 13px; color: inherit; font: inherit;
    transition: background .15s, border-color .15s, opacity .2s, transform .12s;
  }
  .card:hover { background: var(--panel2); transform: translateX(2px); }
  .card:focus-visible { outline: 1px solid var(--blue); outline-offset: 1px; }
  .card .idx { color: #4d545e; font-size: 11px; padding-top: 2px; }
  .card .path { display: block; color: var(--c); font-size: 13px; font-weight: 600; letter-spacing: .01em; }
  .card .tag { display: block; color: var(--fg); font-size: 11.5px; opacity: .82; margin-top: 1px; }
  .card .pkgs {
    display: block; color: var(--muted); font-size: 11px; margin-top: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card .go { color: #3f4650; font-size: 15px; text-align: right; transition: color .15s; }
  .card:hover .go { color: var(--c); }
  .card[data-active="true"] { background: #1a212a; border-color: #3a4452; border-left-color: var(--c); }
  .card[data-active="true"] .go { color: var(--c); }
  .stack.filtered .card:not([data-active="true"]) { opacity: .34; }
  .link { height: 16px; margin-left: 15px; border-left: 1px dashed #333c47; }
  .link::before {
    content: ""; display: block; width: 5px; height: 5px; margin: 13px 0 0 -3px;
    border-right: 1px solid #4a5361; border-bottom: 1px solid #4a5361; transform: rotate(45deg);
  }
  .rail {
    margin-top: 18px; border: 1px dashed #333c47; border-radius: 2px; padding: 10px 12px;
    background: rgba(23,28,34,.45);
  }
  .rail h4 { margin: 0 0 8px; font-size: 10.5px; letter-spacing: .16em; color: #5d646f; font-weight: 500; text-transform: uppercase; }
  .rail .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .rail span {
    font-size: 11px; color: var(--slate); border: 1px solid #2b333d; border-radius: 2px;
    padding: 2px 7px; background: #10141a;
  }

  /* ── detail ─────────────────────────────────────────── */
  .detail {
    position: sticky; top: 16px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 2px; padding: 18px 20px;
    max-height: calc(100vh - 40px); overflow: auto;
  }
  @media (max-width: 880px) { .detail { position: static; max-height: none; } }
  .detail::-webkit-scrollbar { width: 8px; }
  .detail::-webkit-scrollbar-thumb { background: #2b333d; border-radius: 4px; }
  .detail .eyebrow { font-size: 10.5px; letter-spacing: .18em; color: #5d646f; text-transform: uppercase; }
  .detail h2 {
    margin: 6px 0 2px; font-size: 17px; font-weight: 600; letter-spacing: .01em;
    color: var(--d, var(--fg));
  }
  .detail .sub2 { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .detail p.summary { margin: 0 0 16px; color: #b9c0cb; font-size: 12.5px; }
  .sec { margin-top: 18px; }
  .sec > h3 {
    font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
    color: #5d646f; font-weight: 500; margin: 0 0 9px;
  }
  details.pkg { border: 1px solid var(--border); border-radius: 2px; margin-bottom: 6px; background: #10151a; }
  details.pkg > summary {
    cursor: pointer; padding: 7px 10px; font-size: 12px; color: var(--blue);
    display: flex; gap: 8px; align-items: baseline; list-style: none;
  }
  details.pkg > summary::-webkit-details-marker { display: none; }
  details.pkg > summary::before { content: "▸"; color: #4d545e; font-size: 10px; }
  details.pkg[open] > summary::before { content: "▾"; color: var(--blue); }
  details.pkg > summary .role { color: var(--muted); font-size: 11.5px; }
  details.pkg .files {
    padding: 4px 12px 10px 26px; display: flex; flex-wrap: wrap; gap: 5px 6px;
    border-top: 1px solid #1c222a;
  }
  details.pkg .files code {
    font-size: 10.8px; color: #9aa4b2; background: #161b21; border: 1px solid #232a33;
    padding: 1px 5px; border-radius: 2px;
  }
  ul.rules { margin: 0; padding: 0; list-style: none; }
  ul.rules li {
    display: flex; gap: 8px; font-size: 12px; color: #b1b9c4; padding: 5px 0;
    border-bottom: 1px solid #1a2028;
  }
  ul.rules li:last-child { border-bottom: 0; }
  ul.rules li .mark { color: var(--rose); flex: 0 0 auto; }
  ul.rules li .mark.ok { color: var(--mint); }
  pre.shape {
    margin: 0; padding: 10px 12px; background: #0d1116; border: 1px solid var(--border);
    border-radius: 2px; overflow-x: auto; font-size: 11.5px; line-height: 1.7; color: #9fb0c4;
  }
  pre.shape b { color: var(--purple); font-weight: 600; }
  pre.shape i { color: var(--mint); font-style: normal; }
  pre.shape s { color: #5d646f; }
  .hint { color: #4d545e; font-size: 11px; margin-top: 16px; }

  /* ── loop view ──────────────────────────────────────── */
  .loop { display: grid; gap: 10px; }
  .step { border: 1px solid var(--border); border-left: 2px solid var(--c); border-radius: 2px; background: var(--panel); }
  .step > summary {
    cursor: pointer; list-style: none; padding: 12px 14px; display: grid;
    grid-template-columns: 26px minmax(0,1fr) auto; gap: 12px; align-items: center;
  }
  .step > summary::-webkit-details-marker { display: none; }
  .step > summary .n { color: #4d545e; font-size: 11px; }
  .step > summary .name { color: var(--c); font-size: 13px; font-weight: 600; }
  .step > summary .desc { color: var(--muted); font-size: 11.5px; display: block; font-weight: 400; margin-top: 2px; }
  .step > summary .chev { color: #3f4650; font-size: 11px; }
  .step[open] > summary .chev { color: var(--c); }
  .step .body { padding: 0 16px 14px 52px; border-top: 1px solid #1c222a; }
  .step .body p { margin: 10px 0; color: #b1b9c4; font-size: 12px; }
  .step .body .where { color: #5d646f; font-size: 11px; }
  .loopnote {
    margin-top: 16px; border: 1px dashed #333c47; border-radius: 2px; padding: 12px 14px;
    color: var(--muted); font-size: 11.5px; background: rgba(23,28,34,.45);
  }

  /* ── boundaries view ────────────────────────────────── */
  .bounds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 880px) { .bounds { grid-template-columns: 1fr; } }
  .bound { border: 1px solid var(--border); border-top: 2px solid var(--c); border-radius: 2px; background: var(--panel); padding: 16px; }
  .bound h3 { margin: 0 0 4px; font-size: 13px; color: var(--c); font-weight: 600; }
  .bound .who { color: #5d646f; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 12px; }
  .bound p { margin: 0 0 10px; font-size: 12px; color: #b1b9c4; }
  .bound code { color: var(--blue); font-size: 11.5px; }

  footer { max-width: 1180px; margin: 34px auto 0; color: #4d545e; font-size: 11px; display: flex; flex-wrap: wrap; gap: 14px; }
  footer kbd {
    border: 1px solid #2b333d; border-bottom-width: 2px; border-radius: 2px; padding: 0 5px;
    color: #7b838f; font-size: 10.5px; background: #10141a;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <div>
    <div class="brandline">
      <span class="brand">phi</span>
      <span class="sub">architecture · interactive</span>
    </div>
    <div class="tagline">Lean Go terminal coding-agent harness — 分层栈 / 工具循环 / 边界与不变量</div>
  </div>
  <nav role="tablist">
    <button role="tab" data-view="layers" aria-selected="true">分层栈</button>
    <button role="tab" data-view="loop" aria-selected="false">工具循环</button>
    <button role="tab" data-view="bound" aria-selected="false">边界与不变量</button>
  </nav>
</header>

<div class="searchwrap">
  <input id="q" type="search" placeholder="grep 包名或文件… 例：executor / diffpane / proc.go" autocomplete="off" spellcheck="false" />
  <div class="hits" id="hits"></div>
</div>

<main>
  <!-- 分层栈 -->
  <section id="view-layers">
    <div class="split">
      <div class="stack" id="stack"></div>
      <aside class="detail" id="detail"></aside>
    </div>
  </section>

  <!-- 工具循环 -->
  <section id="view-loop" hidden>
    <div class="loop" id="loop"></div>
    <div class="loopnote">
      循环归属 <code>internal/agent/executor.go</code>：每轮 tool call 都走完整四步，任何一步都不能被绕过 —— 尤其是 Gate/Ask。
    </div>
  </section>

  <!-- 边界 -->
  <section id="view-bound" hidden>
    <div class="bounds" id="bounds"></div>
  </section>
</main>

<footer>
  <span><kbd>1</kbd>–<kbd>7</kbd> 选层</span>
  <span><kbd>Esc</kbd> 回到总览</span>
  <span><kbd>/</kbd> 搜索</span>
  <span>点击包名展开文件</span>
</footer>

<script>
const LAYERS = [
  {
    id: "cmd", idx: 1, color: "teal",
    path: "cmd/", tag: "入口与装配",
    pkgs: "main.go · bootstrap.go · run.go · tui.go · session.go · mcp.go · plugin.go · update.go",
    summary: "唯一装配点。加载 project/config，先构造 collaborator，再把它们显式传给 TUI 根。所有子命令（run / update / sessions / mcp / ext）从这里分叉。",
    packages: [
      { name: "main.go / bootstrap.go", role: "启动序列", files: ["main.go", "bootstrap.go", "exit.go"] },
      { name: "run.go / runloop.go", role: "非交互 run 模式", files: ["run.go", "runloop.go"] },
      { name: "tui.go", role: "构造 Bus / Controller / Editor", files: ["tui.go"] },
      { name: "session.go / mcp.go / plugin.go", role: "子命令", files: ["session.go", "mcp.go", "plugin.go"] },
      { name: "update.go / config_cmd.go", role: "自更新 · 配置命令", files: ["update.go", "config_cmd.go", "config.go"] }
    ],
    rules: [
      { mark: "x", text: "不在 tui 构造函数里藏 GetDefaultProject：装配归 cmd。" },
      { mark: "x", text: "不返回半初始化的 Controller（engineErr zombies）。" },
      { mark: "o", text: "构造顺序：proj.LoadConfig → Bus(redraw.Fire) → Controller → NewEditor → redraw.Bind → app.Run(ui)。" }
    ],
    shape: "<b>main</b>\n  proj.LoadConfig()\n  redraw := controller.NewRedrawRelay()\n  bus    := controller.NewBus(redraw.Fire)\n  ctrl   := controller.NewController(bus, proj)\n  ui     := editor.NewEditor(app, bus, ctrl, …)\n  redraw.Bind(ui.RequestRedraw)\n  app.Run(ui)"
  },
  {
    id: "tui", idx: 2, color: "blue",
    path: "internal/tui + internal/components", tag: "界面壳与渲染",
    pkgs: "editor · controller · transcript · composer · footer · overlays · diffpane · codepane · submit · commands",
    summary: "panda-style 拆分：Editor 是瘦根 widget，各域 handler 自己持有状态，渲染组件留在 components 里做哑件。Agent 生命周期只在 controller，会话到 widget 的投影只在 transcript。",
    packages: [
      { name: "editor/", role: "根 Widget：布局、dispatch、branch watch、command bridge", files: ["Editor", "layout", "dispatch"] },
      { name: "controller/", role: "Engine 生命周期、Bus、Msg、activity、permission 回包", files: ["Bus", "Msg", "Controller"] },
      { name: "transcript/", role: "Mapper：session.Event → 消息列表；子 agent 行", files: ["Mapper", "Pane", "SubagentStore"] },
      { name: "composer/", role: "chat 输入 + / ? @ ! picker + Ctrl+K palette", files: ["ComposerPane", "Wire()", "Input"] },
      { name: "submit/", role: "提交路径：agent prompt / slash / !bash / cancel", files: ["Submitter", "BashRunner"] },
      { name: "overlays/ · diffpane/ · codepane/ · footer/", role: "permission 询问、/diff 评审、/code 源码、状态行", files: ["Overlays", "DiffPane", "CodePane", "FooterChrome"] },
      { name: "commands/", role: "slash/palette 注册表与内置命令", files: ["Registry", "SessionCommands", "BranchCommands", "ExtCommands"] },
      { name: "internal/components/", role: "哑渲染件：chat、input、palette、mention、diffview、codeview", files: ["chat", "input", "palette", "mention", "diffview", "codeview"] }
    ],
    rules: [
      { mark: "x", text: "硬规则：handler 上不许有 *Editor 反向指针。跨域走注入 ref、callback 或 Bus.Publish。" },
      { mark: "o", text: "controller 只向 Bus 发 Msg；不直接改 widget。" },
      { mark: "o", text: "ToastMsg 由 Editor 拥有浮层，不注入 toast 回调。" },
      { mark: "o", text: "哑件不持状态：渲染归 components，编排归 tui。" }
    ],
    shape: "<b>cmd/main.go</b>\n  └─ editor.NewEditor(app, bus, ctrl, …)\n       ├─ TranscriptPane   snap/list/Mapper/子 agent\n       ├─ ComposerPane     chat + pickers + palette\n       ├─ FooterChrome     rss/token/update 提示\n       ├─ Overlays         permission · ext-confirm\n       ├─ DiffPane         /diff\n       ├─ CodePane         /code\n       └─ Submitter        Submit/Cancel/Slash → Controller"
  },
  {
    id: "agent", idx: 3, color: "purple",
    path: "internal/agent", tag: "引擎与工具循环",
    pkgs: "engine.go · engine_runner.go · executor.go · jobs.go · child_spec.go · prompt/",
    summary: "Engine 管轮次与上下文，executor 管单个 tool call 的四步闭环，jobs 管子 agent。system prompt 由 prompt/ 的模板加 Skills/MCP 目录渲染。",
    packages: [
      { name: "engine.go / engine_runner.go", role: "轮次推进、停止条件、流式装配", files: ["engine.go", "engine_runner.go", "option.go"] },
      { name: "executor.go", role: "ExtensionPre → Gate/Ask → Run → ExtensionPost", files: ["executor.go"] },
      { name: "jobs.go / child_spec.go", role: "子 agent 的 spawn / wait / cancel 与角色规格", files: ["jobs.go", "child_spec.go"] },
      { name: "session.go", role: "引擎侧会话视图", files: ["session.go"] },
      { name: "prompt/", role: "系统提示模板 + Skills / MCP 目录渲染", files: ["system-prompt.tmpl", "skills-prompt.tmpl", "mcp-prompt.tmpl", "context.go"] }
    ],
    rules: [
      { mark: "x", text: "不许绕过 permission gate 直接执行工具。" },
      { mark: "o", text: "子 agent transcript 落 ~/.phi/jobs/<id>/，父上下文只拿 wait/task 摘要。" },
      { mark: "o", text: "子 engine 没有 agent_* 工具（禁止嵌套），默认 explore 角色（不可写）。" }
    ],
    shape: "engine round\n  <i>ExtensionPre</i>       扩展可拦截 / 重写参数\n  <i>Gate / Ask</i>         permission 策略 → overlays 询问\n  <i>Run</i>                 read write edit bash ls find grep agent | mcp://\n  <i>ExtensionPost</i>      扩展观察结果\n  <s>→</s> tool result 进 transcript → 下一轮 | 结束"
  },
  {
    id: "cap", idx: 4, color: "mint",
    path: "internal/tools + mcp + permission + toolmanager", tag: "能力层",
    pkgs: "readtool · writetool · edittool · bashtool · lstool · greptool · findtool · agenttool · tooldef",
    summary: "每个工具一个包，定义统一收在 tooldef。MCP 不往模型上塞 schema，而是借 ls / read / write 的 mcp:// URL 通过。",
    packages: [
      { name: "readtool/ · writetool/ · lstool/", role: "文件三件套，支持 mcp:// 目标", files: ["read.go", "write.go", "ls.go"] },
      { name: "edittool/", role: "fail-closed 锚点补丁：SM:EDIT / FIND / PUT|AFTER", files: ["edit.go", "apply.go", "locate.go", "match.go", "sloppy/"] },
      { name: "bashtool/", role: "shell 执行、进程组、输出收集、shellconfig", files: ["bash.go", "shell_exec.go", "collect.go", "process_windows.go", "shellconfig.go"] },
      { name: "greptool/ · findtool/", role: "内容检索与文件名检索", files: ["grep.go", "find.go", "glob.go"] },
      { name: "agenttool/", role: "子 agent 工具（spawn/wait/cancel 的入口）", files: ["agent.go", "agent_result.go"] },
      { name: "tooldef/", role: "工具定义、路径、权限、MCP URL 解析", files: ["tool.go", "context.go", "path.go", "permission.go", "mcpurl.go"] },
      { name: "internal/mcp/", role: "stdio + http 客户端、连接池、元工具路由", files: ["client.go", "pool.go", "rpc.go", "stdio.go", "http.go", "compact.go"] },
      { name: "internal/permission/", role: "策略求值 + ask gate", files: ["policy", "gate"] },
      { name: "internal/toolmanager/", role: "外部工具发现与下载", files: ["discover", "install"] }
    ],
    rules: [
      { mark: "o", text: "edit 必须 fail-closed：锚点缺失或歧义 → 报错并给可复制 payload，永不退回整文件重写。" },
      { mark: "o", text: "MCP 零 schema 污染：模型只看到 ls / read / write，MCP 走 mcp://<server>/tools/<tool>。" },
      { mark: "o", text: "工具定义单一来源 tooldef；新工具不该自己另造 context/path 语义。" }
    ],

const LOOP = [

    where: "internal/extension/core/view.go · Runner.dispatch"
  },
  {

/* ── render: stack ───────────────────────────────────── */
const stackEl = document.getElementById("stack");
stackEl.innerHTML = LAYERS.map((l, i) => `
  <button class="card" data-id="${l.id}" style="--c: var(--${l.color})" aria-pressed="false">
    <span class="idx">${String(l.idx).padStart(2, "0")}</span>
    <span>
      <span class="path">${l.path}</span>
      <span class="tag">${l.tag}</span>
      <span class="pkgs">${l.pkgs}</span>
    </span>
    <span class="go">›</span>

`).join("") + `
  <div class="rail">

    <div class="row">
      <span>LLM APIs</span><span>MCP servers (stdio|http)</span>
      <span>扩展子进程 (PXB)</span><span>文件系统 &amp; OS</span>

document.getElementById("loop").innerHTML = LOOP.map((s, i) => `

/* ── render: bounds ──────────────────────────────────── */

/* ── detail panel ────────────────────────────────────── */
const detailEl = document.getElementById("detail");

function overview() {
  detailEl.style.setProperty("--d", "var(--fg)");
  detailEl.innerHTML = `
    <div class="eyebrow">总览</div>
    <h2>依赖方向是单向的</h2>
    <div class="sub2">点左侧任意一层看它持有什么、遵守什么。</div>
    <p class="summary">cmd 装配 → tui 呈现 → controller 驱动 → agent 决策 → 能力层与模型客户端执行 → 状态层落盘。extension 与 mcp 挂在 agent 旁侧，不向下扇出。</p>

    <div class="sec">
      <h3>依赖方向</h3>
      <pre class="shape">cmd
 <s>↓</s>
internal/tui
 <s>↓</s>  <s>(只发 Msg)</s>
internal/tui/controller
 <s>↓</s>
internal/agent
 <s>↓</s>            <s>(旁侧)</s>
{tools, mcp, permission}   internal/extension
 <s>↓</s>
{llm, session, project}</pre>
    </div>

    <div class="sec">
      <h3>三条设计赌注</h3>
      <ul class="rules">
        <li><span class="mark">•</span><span>少依赖、快启动：直接模块依赖刻意很少，启动与空闲 RSS 是硬指标。</span></li>
        <li><span class="mark">•</span><span>哑组件 + 自持状态 handler：不让一个巨型 widget 越权持有全部状态。</span></li>
        <li><span class="mark">•</span><span>扩展是进程，不是插件函数：崩溃隔离，热换不打断服务。</span></li>
      </ul>
    </div>

    <div class="sec">
      <h3>数据流一句话</h3>
      <pre class="shape">按键 → composer → submit
  → controller.Engine
    → 工具循环（gate 在前）
      → session 事件
        → transcript.Mapper → 消息列表 → 绘制</pre>
    </div>

    <div class="hint">↑ 键盘 1–7 直接跳层，/ 搜索包名。</div>`;
}

function showLayer(id) {
  const l = LAYERS.find(x => x.id === id);
  if (!l) return;
  detailEl.style.setProperty("--d", `var(--${l.color})`);
  detailEl.innerHTML = `
    <div class="eyebrow">${String(l.idx).padStart(2, "0")} / ${LAYERS.length}</div>
    <h2>${l.path}</h2>
    <div class="sub2">${l.tag}</div>
    <p class="summary">${l.summary}</p>

    <div class="sec">
      <h3>包与文件 · 点击展开</h3>
      ${l.packages.map((p, i) => `
        <details class="pkg" id="pkg-${l.id}-${i}">
          <summary>
            <span>${p.name}</span>
            <span class="role">${p.role}</span>
          </summary>
          <div class="files">${p.files.map(f => `<code>${f}</code>`).join("")}</div>
        </details>`).join("")}
    </div>

    <div class="sec">
      <h3>约束与不变量</h3>
      <ul class="rules">
        ${l.rules.map(r => `<li><span class="mark ${r.mark === "o" ? "ok" : ""}">${r.mark === "o" ? "✓" : "✕"}</span><span>${r.text}</span></li>`).join("")}
      </ul>
    </div>

    <div class="sec">
      <h3>调用形状</h3>
      <pre class="shape">${l.shape}</pre>
    </div>

    <div class="hint">Esc 回到总览。</div>`;
  detailEl.scrollTop = 0;
}

let active = null;
function select(id) {
  active = id;
  stackEl.classList.toggle("filtered", !!id);
  document.querySelectorAll(".card").forEach(c => {
    const on = c.dataset.id === id;
    c.dataset.active = on ? "true" : "false";
    c.setAttribute("aria-pressed", on ? "true" : "false");
  });
  if (id) showLayer(id); else overview();
}

stackEl.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (card) select(card.dataset.id === active ? null : card.dataset.id);
});

/* ── tabs ────────────────────────────────────────────── */
const views = { layers: "view-layers", loop: "view-loop", bound: "view-bound" };
let currentView = "layers";
document.querySelectorAll("nav button").forEach(btn => {
  btn.addEventListener("click", () => {
    currentView = btn.dataset.view;
    document.querySelectorAll("nav button").forEach(b =>
      b.setAttribute("aria-selected", b.dataset.view === currentView ? "true" : "false"));
    Object.entries(views).forEach(([k, v]) => {
      document.getElementById(v).hidden = k !== currentView;
    });
  });
});

/* ── search ──────────────────────────────────────────── */
const qEl = document.getElementById("q");
const hitsEl = document.getElementById("hits");

function search(term) {
  const t = term.trim().toLowerCase();
  if (!t) { hitsEl.classList.remove("on"); hitsEl.innerHTML = ""; return; }
  const out = [];
  LAYERS.forEach(l => {
    l.packages.forEach((p, i) => {
      const hay = (p.name + " " + p.role + " " + p.files.join(" ") + " " + l.path).toLowerCase();
      if (hay.includes(t)) out.push({ l, p, i, where: l.path });
    });
  });
  const hits = out.slice(0, 9);
  hitsEl.innerHTML = hits.length
    ? hits.map(h => `<button class="hit" data-layer="${h.l.id}" data-pkg="${h.i}">
        <span>${h.p.name}</span><span class="where">${h.where}</span>
      </button>`).join("")
    : `<div class="hit" style="cursor:default;color:#5d646f">无匹配：${term}</div>`;
  hitsEl.classList.add("on");
}

qEl.addEventListener("input", () => search(qEl.value));
qEl.addEventListener("keydown", e => {
  if (e.key === "Escape") { qEl.value = ""; qEl.blur(); hitsEl.classList.remove("on"); }
  if (e.key === "Enter") {
    const first = hitsEl.querySelector(".hit[data-layer]");
    if (first) first.click();
  }
});
hitsEl.addEventListener("click", e => {
  const hit = e.target.closest(".hit[data-layer]");
  if (!hit) return;
  document.querySelector('nav button[data-view="layers"]').click();
  select(hit.dataset.layer);
  const d = document.getElementById(`pkg-${hit.dataset.layer}-${hit.dataset.pkg}`);
  if (d) { d.open = true; d.scrollIntoView({ block: "center", behavior: "smooth" }); }
  hitsEl.classList.remove("on");
  qEl.blur();
});

/* ── keyboard ────────────────────────────────────────── */
document.addEventListener("keydown", e => {
  if (e.target === qEl) return;
  if (e.key === "/") { e.preventDefault(); qEl.focus(); return; }
  if (e.key === "Escape") { select(null); return; }
  if (/^[1-7]$/.test(e.key) && currentView === "layers") {
    select(LAYERS[Number(e.key) - 1].id);
  }
});

overview();
</script>
