# Dependency updates for Go modules and GitHub Actions.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
# Note: `interval` is how often Dependabot checks for updates; it cannot make a single
# run faster. GH-hosted checks have no user-facing speed knob.
version: 2
updates:
  # Go module dependencies (go.mod / go.sum)
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      go-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - dependencies
