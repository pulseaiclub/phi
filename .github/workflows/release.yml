name: Release

on:
  push:
    tags:
      - 'v*'          # matches v1.0.0, v0.2.3, etc.
      - 'v*-*'        # matches v1.0.0-alpha, v2.0.0-rc1, etc.

permissions:
  contents: write      # allow creating a Release
  id-token: write      # npm provenance

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history needed for GoReleaser

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      # Notes must live outside the workspace: GoReleaser aborts on a dirty git tree,
      # and writing release-notes.md in the repo root would leave an untracked file.
      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          NOTES="${RUNNER_TEMP}/release-notes.md"
          scripts/changelog-extract.sh "${{ github.ref_name }}" > "$NOTES"
          echo "---- release notes ----"
          cat "$NOTES"
          if [[ ! -s "$NOTES" ]]; then
            echo "error: release notes empty (no CHANGELOG section for ${{ github.ref_name }}?)" >&2
            exit 1
          fi
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true

      - name: Run GoReleaser
        run: goreleaser release --clean --release-notes="${{ steps.changelog.outputs.path }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    runs-on: ubuntu-latest
    needs: goreleaser
    defaults:
      run:
        working-directory: ext/ts
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: ext/ts/package-lock.json

      - name: Publish @pulseaiclub/phi-ext
        run: |
          npm ci
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
