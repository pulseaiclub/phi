name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            test-command: make test
          - os: macos-latest
            test-command: make test
          - os: windows-latest
            test-command: go test ./...
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Pin to go.mod — `stable` can jump ahead of golangci-lint's build Go.
          go-version-file: go.mod

      - name: Run tests
        run: ${{ matrix.test-command }}

  ext-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ext/ts/package-lock.json

      - name: Test Go ext module
        run: go test ./...
        working-directory: ext/go

      - name: Test TypeScript SDK
        run: npm ci && npm test
        working-directory: ext/ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          install-only: true

      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@v0.49.0

      - name: Check
        run: make check
