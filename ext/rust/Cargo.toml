[package]
name = "phi-ext"
version = "0.7.1"
edition = "2021"
rust-version = "1.75"
description = "Rust author SDK for Phi PXB extensions (port of ext/go)"
license = "MIT"
repository = "https://github.com/pulseaiclub/phi"
keywords = ["phi", "coding-agent", "extension", "pxb"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }

[[example]]
name = "sdk-probe"
path = "tests/fixtures/probe.rs"